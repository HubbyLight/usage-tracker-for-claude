name: Build

# Builds distributable apps on GitHub's machines — including the macOS .dmg,
# which cannot be produced on Windows.
#
#   - Push a version tag (e.g. `git tag v0.2.0 && git push origin v0.2.0`) to
#     build BOTH platforms and publish a public GitHub Release with the
#     .dmg / .exe / .zip attached — that's the easy, login-free download link
#     shown on the repo's front page.
#   - Or use the Actions tab -> "Run workflow" to just build and grab the files
#     from the run's Artifacts (requires being signed in to GitHub).
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write        # needed to create the Release on tag builds

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            args: --win
            name: windows
          - os: macos-latest
            args: --mac
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx electron-builder ${{ matrix.args }} --publish never
      # Always upload build outputs as run artifacts (handy for dispatch runs).
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
      # On a version tag, attach the same files to a public GitHub Release so
      # anyone can download them directly — no login, no Actions navigation.
      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          fail_on_unmatched_files: false
          body: |
            Download for your platform below.

            **Windows** — `.exe` (portable, just run it).

            **macOS** — `.dmg`. The app isn't signed with an Apple Developer
            certificate, so macOS quarantines it and may say *"…will damage your
            computer"* / *"is damaged."* That's Gatekeeper blocking an unsigned
            download, not malware. To run it:
            1. Drag **Claude Usage.app** into **Applications**.
            2. Open **Terminal** and run (type `xattr -cr ` then drag the app
               onto the window to fill the path):
               `xattr -cr "/Applications/Claude Usage.app"`
            3. Open the app normally — you only do this once.
