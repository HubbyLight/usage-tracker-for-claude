name: Build

# Builds distributable apps on GitHub's machines — including the macOS .dmg,
# which cannot be produced on Windows.
#
#   - Push a version tag (e.g. `git tag v0.2.0 && git push origin v0.2.0`) to
#     build BOTH platforms and publish a public GitHub Release with the
#     .dmg / .exe / .zip attached — that's the easy, login-free download link
#     shown on the repo's front page.
#   - Or use the Actions tab -> "Run workflow" to just build and grab the files
#     from the run's Artifacts (requires being signed in to GitHub).
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write        # needed to create the Release on tag builds

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            args: --win
            name: windows
          - os: macos-latest
            args: --mac
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx electron-builder ${{ matrix.args }} --publish never
      # Always upload build outputs as run artifacts (handy for dispatch runs).
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
      # SHA-256 checksums next to each binary so users (and AV vendors handling a
      # false-positive report) can confirm a download is the CI-built original.
      - name: Write checksums
        shell: bash
        run: |
          cd dist
          shopt -s nullglob
          for f in *.exe *.dmg *.zip; do
            if command -v sha256sum >/dev/null; then h=$(sha256sum "$f"); else h=$(shasum -a 256 "$f"); fi
            # Name the file as GitHub serves it (it turns spaces into dots on
            # upload) so `shasum -c` works on the downloaded pair.
            echo "${h%% *}  ${f// /.}" > "$f.sha256"
          done
          cat *.sha256
      # On a version tag, attach the same files to a public GitHub Release so
      # anyone can download them directly — no login, no Actions navigation.
      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.sha256
          fail_on_unmatched_files: false
          body: |
            Download for your platform below. Each file has a matching `.sha256`
            checksum — every binary here is built from this tag's source by the
            public GitHub Actions workflow (`.github/workflows/build.yml`).

            **What the app does:** it opens claude.ai in its own window so you can
            sign in, then reads only `claude.ai/api/organizations/…/usage` with that
            session. It contacts no other server, and launch-at-login stays off
            unless you turn it on from the tray menu.

            **Windows** — `.exe` (portable, just run it). It isn't code-signed, so
            SmartScreen may warn: click **More info → Run anyway**.

            **macOS** — `.dmg`. It isn't notarized by Apple, so Gatekeeper may
            refuse to open it. Steps to allow it are in the
            [README](https://github.com/HubbyLight/usage-tracker-for-claude#macos);
            if you'd rather not run Terminal commands, use the
            [run-from-source](https://github.com/HubbyLight/usage-tracker-for-claude#run-from-source-no-gatekeeper-hassle)
            option instead.
